[project]
name = "baton-api"
version = "0.1.0"
description = "Baton API: evidence-graded knowledge handover"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "httpx>=0.28",
    "rapidfuzz>=3.10",
    "python-multipart>=0.0.17",
    "pypdf>=5.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["baton"]

[tool.ruff.lint]
# B008: FastAPI's Depends() in defaults is the framework's idiom. S110: llm_calls logging must never raise.
ignore = ["B008", "S110", "RUF059", "E501"]
extend-exclude = ["alembic/versions"]
